        - generic [ref=e29]:
          - 'heading "AI Adoption in Healthcare in New Zealand: A Living Whitepaper" [level=1] [ref=e30]'
          - heading "Introduction" [level=2] [ref=e31]
          - paragraph [ref=e32]:
            - text: New Zealand’s healthcare system is under pressure from an aging population and chronic workforce shortages. The AI Forum of NZ observes that pervasive doctor and nurse gaps mean “AI is the answer” to amplify scarce clinical expertise (
            - link "aiforum.org.nz" [ref=e33] [cursor=pointer]:
              - /url: https://aiforum.org.nz/2022/10/31/ai-in-healthcare-nz-leading-the-world/#:~:text=The%20AI%20Forum%20NZ%20says,artificial%20intelligence%2C%20is%20the%20answer
            - text: ). In response, officials are championing a
            - strong [ref=e34]: precision health
            - text: approach – tailoring care with rich data (genomics, lifestyle, etc.) and judicious AI use. National strategies (e.g. the 2025 AI Strategy and Digital Health Investment Plan) emphasize accelerating safe AI adoption in hospitals and clinics (
            - link "www.hinz.org.nz" [ref=e35] [cursor=pointer]:
              - /url: https://www.hinz.org.nz/news/705831/#:~:text=intelligence%20exploration%20and%20adoption,foreword%20that%20it%20complements%20work
            - text: ) (
            - link "www.ai-health-research.org.nz" [ref=e36] [cursor=pointer]:
              - /url: https://www.ai-health-research.org.nz/our-story#:~:text=
            - text: "). However, NZ remains in an early stage: most AI work to date has been small pilots and back-office tools, with strong emphasis on"
            - strong [ref=e37]: safety, equity and clinician oversight
            - text: in any new deployments.
          - list [ref=e38]:
            - listitem [ref=e39]:
              - strong [ref=e40]: "Context:"
              - text: Public hospitals struggle with >8,000 vacant roles. AI tools (imaging analysis, e-scribes, workflows) are seen as productivity “force multipliers” to deliver faster care (
              - link "aiforum.org.nz" [ref=e41] [cursor=pointer]:
                - /url: https://aiforum.org.nz/2022/10/31/ai-in-healthcare-nz-leading-the-world/#:~:text=The%20AI%20Forum%20NZ%20says,artificial%20intelligence%2C%20is%20the%20answer
              - text: ) (
              - link "www.hinz.org.nz" [ref=e42] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/705831/#:~:text=intelligence%20exploration%20and%20adoption,foreword%20that%20it%20complements%20work
              - text: ).
            - listitem [ref=e43]:
              - strong [ref=e44]: "Strategy:"
              - text: Government’s AI Strategy (July 2025) highlights healthcare among key sectors. Officials encourage tailored AI solutions (e.g. diagnostic tools) in NZ while fast-tracking adoption via training and removing barriers (
              - link "www.hinz.org.nz" [ref=e45] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/705831/#:~:text=intelligence%20exploration%20and%20adoption,foreword%20that%20it%20complements%20work
              - text: ) (
              - link "www.beehive.govt.nz" [ref=e46] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-investment-drive-ai-and-biotech-innovation#:~:text=%E2%80%9COur%20AI%20Strategy%20is%20about,in%20healthcare%2C%E2%80%9D%20says%20Dr%20Reti
              - text: ). A precision-health policy also calls for AI-assisted diagnosis and administration, but under strict evaluation.
          - heading "Current News" [level=2] [ref=e47]
          - list [ref=e48]:
            - listitem [ref=e49]:
              - strong [ref=e50]: "Nationwide AI “scribe” rollout (Feb 2026):"
              - text: Health NZ announced that every hospital emergency department now has an AI-driven documentation scribe (ambient speech AI) deployed to ~1,250 clinicians (
              - link "www.beehive.govt.nz" [ref=e51] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department#:~:text=Every%20emergency%20department%20in%20the,Health%20Minister%20Simeon%20Brown%20says
              - text: "). Pilot results were striking: doctors saved ~15 minutes per patient (allowing one extra patient per shift) and 80–84% of staff reported improved efficiency and experience ("
              - link "www.beehive.govt.nz" [ref=e52] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department#:~:text=%E2%80%9CThis%20places%20New%20Zealand%20among,%E2%80%9D
              - text: ) (
              - link "www.beehive.govt.nz" [ref=e53] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department#:~:text=%E2%80%9CAfter%20one%20month%20of%20use,%E2%80%9D
              - text: ). This makes NZ among the fastest countries to move from pilot to nationwide AI in EDs, markedly reducing paperwork burdens (
              - link "www.beehive.govt.nz" [ref=e54] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department#:~:text=%E2%80%9CThis%20places%20New%20Zealand%20among,%E2%80%9D
              - text: ).
            - listitem [ref=e55]:
              - strong [ref=e56]: "AI for breast screening (Feb 2026):"
              - text: The Health Ministry initiated an exploratory process for AI-assisted mammogram reading. Health NZ is inviting specialists and vendors to outline how validated AI image-analysis tools could safely augment BreastScreen Aotearoa. The goal is to “future-proof” services as screenings expand – e.g. extending the target age – by ensuring quality care and radiologist support through AI (
              - link "www.beehive.govt.nz" [ref=e57] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/exploring-ai-support-breast-screening-services#:~:text=Artificial%20Intelligence%20,Health%20Minister%20Simeon%20Brown%20says
              - text: ) (
              - link "www.beehive.govt.nz" [ref=e58] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/exploring-ai-support-breast-screening-services#:~:text=This%20is%20the%20first%20step,clinical%20oversight%20and%20safety%20standards
              - text: ).
            - listitem [ref=e59]:
              - strong [ref=e60]: "International research partnerships (Jul 2025):"
              - text: The government committed NZ$24 million via Catalyst funding to AI and biotech R&D with Singapore (
              - link "www.beehive.govt.nz" [ref=e61] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-investment-drive-ai-and-biotech-innovation#:~:text=The%20Government%20is%20investing%20%2424,development%20of%20sustainable%20food%20industries
              - text: ) (
              - link "www.beehive.govt.nz" [ref=e62] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-investment-drive-ai-and-biotech-innovation#:~:text=The%20AI%20programme%2C%20delivered%20alongside,and%20deliver%20better%20public%20services
              - text: ). In AI, projects focus on
              - strong [ref=e63]: healthy ageing and clinician support
              - text: ", explicitly aiming to develop tools that help providers and improve care for older New Zealanders ("
              - link "www.beehive.govt.nz" [ref=e64] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-investment-drive-ai-and-biotech-innovation#:~:text=The%20Government%20is%20investing%20%2424,development%20of%20sustainable%20food%20industries
              - text: ) (
              - link "www.beehive.govt.nz" [ref=e65] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-investment-drive-ai-and-biotech-innovation#:~:text=%E2%80%9COur%20AI%20Strategy%20is%20about,in%20healthcare%2C%E2%80%9D%20says%20Dr%20Reti
              - text: ). This ties into the national AI Strategy’s push to boost productivity and “deliver faster, smarter” services including healthcare.
            - listitem [ref=e66]:
              - strong [ref=e67]: "HRC AI research funding:"
              - text: In early 2025 the Health Research Council launched a NZ$5 million AI-in-health RFP (
              - link "gateway.hrc.govt.nz" [ref=e68] [cursor=pointer]:
                - /url: https://gateway.hrc.govt.nz/funding/priorities-funding/2025-artificial-intelligence-in-healthcare#:~:text=2025%20Artificial%20Intelligence%20,Healthcare
              - text: ). It seeks cross-disciplinary projects that leverage AI ethically to reduce wait times, improve diagnostics or enhance outcomes. Grants (up to NZ$700k/2y) begin Aug 2025, targeting national priorities.
            - listitem [ref=e69]:
              - strong [ref=e70]: "Sector events & advocacy:"
              - text: Major conferences (e.g. HiNZ Digital Health Week, Oct 2023/Nov 2025) highlight AI’s role. Professional bodies issued guidance (e.g. RANZCR’s statements on safe AI use) and the new AI-in-Health Research Network now links universities, tech firms and clinicians to share best practices with Te Tiriti-aligned ethics (
              - link "www.ai-health-research.org.nz" [ref=e71] [cursor=pointer]:
                - /url: https://www.ai-health-research.org.nz/our-story#:~:text=
              - text: ).
          - heading "Research and Initiatives" [level=2] [ref=e72]
          - list [ref=e73]:
            - listitem [ref=e74]:
              - strong [ref=e75]: "Government funding:"
              - text: The $24M Catalyst projects and HRC’s $5M RFP (above) signal commitment to AI R&D. Additional government signals include precursors like the 2023 Chief Science Advisor report calling for strong governance of healthcare AI. That report’s 17 principles demand that hospitals have formal AI policies, clinical oversight of AI-driven decisions, and rigorous evaluation for safety, bias, security and Māori data sovereignty (
              - link "www.hinz.org.nz" [ref=e76] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/671309/#:~:text=entities%20must%20have%20policies%20regulating,regulating%20the%20use%20of%20AI
              - text: ) (
              - link "www.hinz.org.nz" [ref=e77] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/671309/#:~:text=%E2%80%9CSuch%20policies%20should%20specify%20an,evaluation%2C%20and%20authorisation%20of%20AI
              - text: ). Health NZ and the Ministry are now shaping regulatory frameworks (with international collaboration) to ensure new AI tools meet these standards before widespread use.
            - listitem [ref=e78]:
              - strong [ref=e79]: "Coordination efforts:"
              - text: In 2024 an
              - strong [ref=e80]: AI in Health Research Network
              - text: was formed to unite NZ researchers (Universities, tech institutes and industry) around healthcare AI. Its mission is to drive collaborative projects and knowledge-sharing so NZ can “be at the forefront of AI innovation for better health outcomes”, explicitly upholding Te Tiriti o Waitangi obligations (
              - link "www.ai-health-research.org.nz" [ref=e81] [cursor=pointer]:
                - /url: https://www.ai-health-research.org.nz/our-story#:~:text=
              - text: ). This network aims to streamline translating AI pilots into practice (e.g. through shared data/tools) while emphasizing equity and Māori engagement.
            - listitem [ref=e82]:
              - strong [ref=e83]: "Digital health modernization:"
              - text: In late 2025 the government unveiled a national Digital Health Investment Plan. Though broader than AI, it will fund data platforms (e.g. shared health records, genomics infrastructure) that underpin future AI. For example, a planned national radiology image system (with AI triage) and expanded electronic records will create data scale for AI modeling. The public sector also rolled out AI training for health leaders and an AI policy framework for all agencies, indicating rising institutional readiness to adopt AI.
          - heading "Case Studies and Examples" [level=2] [ref=e84]
          - list [ref=e85]:
            - listitem [ref=e86]:
              - strong [ref=e87]: "Medtech Global (GP documentation):"
              - text: In Feb 2026 Christchurch-based Medtech Global launched
              - emphasis [ref=e88]: Medtech AI
              - text: ", a new AI “intelligence layer” built into its Evolution practice-management system ("
              - link "www.dha.org.nz" [ref=e89] [cursor=pointer]:
                - /url: https://www.dha.org.nz/member-news/medtech-global-launches-ai-powered-intelligence-layer-moving-beyond-traditional-scribing/#:~:text=Kiwi%20GPs%20can%20benefit%20from,fully%20integrated%20with%20Medtech%20Evolution
              - text: ). Unlike generic scribes, this tool synthesizes the patient’s full medical record to provide context. It auto-generates structured consultation notes, referral letters and summaries that clinicians can review and edit in real time (
              - link "www.dha.org.nz" [ref=e90] [cursor=pointer]:
                - /url: https://www.dha.org.nz/member-news/medtech-global-launches-ai-powered-intelligence-layer-moving-beyond-traditional-scribing/#:~:text=Unlike%20standalone%20transcription%20tools%20that,%E2%80%98information%20overload%E2%80%99%20in%20healthcare%20settings
              - text: ) (
              - link "www.dha.org.nz" [ref=e91] [cursor=pointer]:
                - /url: https://www.dha.org.nz/member-news/medtech-global-launches-ai-powered-intelligence-layer-moving-beyond-traditional-scribing/#:~:text=The%20new%20platform%20generates%20structured,referral%20letters%2C%20and%20clinical%20correspondence
              - text: ). Medtech estimates the AI will save clinicians ~6–8 minutes per consult, tackling “information overload” so GPs spend more time with patients (
              - link "www.dha.org.nz" [ref=e92] [cursor=pointer]:
                - /url: https://www.dha.org.nz/member-news/medtech-global-launches-ai-powered-intelligence-layer-moving-beyond-traditional-scribing/#:~:text=GP%20Tim%20Ross%20says%2C%20%E2%80%9Cpaperwork,face%20engaging%20with%20the%20patient
              - text: ) (
              - link "www.dha.org.nz" [ref=e93] [cursor=pointer]:
                - /url: https://www.dha.org.nz/member-news/medtech-global-launches-ai-powered-intelligence-layer-moving-beyond-traditional-scribing/#:~:text=Patterson%20says%20reduced%20documentation%20time,helping%20to%20prevent%20clinician%20burnout
              - text: ). This product joins NZ’s portfolio of AI co-pilots (alongside specialist scribes like Medow Health).
            - listitem [ref=e94]:
              - strong [ref=e95]: "Diabetes retinal screening (South Auckland):"
              - text: In Feb 2025 a pilot in Māngere equipped seven GP practices with AI-enabled retinal cameras (
              - link "www.beehive.govt.nz" [ref=e96] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-ai-diabetes-screening-pilot-programme-gamechanger-wait-times#:~:text=%E2%80%9CThe%20pilot%20programme%20will%20enable,the%20pilot%20by%20an%20ophthalmologist
              - text: ). Trained community technicians capture eye images from patients with diabetes, and an AI tool immediately grades for diabetic retinopathy risk (
              - link "www.beehive.govt.nz" [ref=e97] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-ai-diabetes-screening-pilot-programme-gamechanger-wait-times#:~:text=%E2%80%9CThe%20use%20of%20AI%20in,ensuring%20patients%20have%20more%20timely
              - text: ). Abnormal images are flagged to ophthalmologists in real time, dramatically increasing screening throughput and shortening waitlists. Early government reports note this “real-time” AI grading frees hospital specialists to focus on confirmed cases and is a “gamechanger” for reducing wait times (
              - link "www.beehive.govt.nz" [ref=e98] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-ai-diabetes-screening-pilot-programme-gamechanger-wait-times#:~:text=%E2%80%9CThe%20use%20of%20AI%20in,ensuring%20patients%20have%20more%20timely
              - text: ) (
              - link "www.beehive.govt.nz" [ref=e99] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-ai-diabetes-screening-pilot-programme-gamechanger-wait-times#:~:text=%E2%80%9CReal,attend%20to%20core%20clinical%20practices
              - text: ).
            - listitem [ref=e100]:
              - strong [ref=e101]: "Mental health chatbots and triage:"
              - text: NZ charities and services are piloting AI-powered support. For example, the veterans’ charity No Duff launched an AI chatbot (trained on 9 years of peer-support transcripts) to provide 24/7 crisis, mindfulness and peer-chat support under clinician supervision. Separately, in Dec 2025 Healthline/Whakarongorau announced a government-backed initiative to build an
              - emphasis [ref=e102]: AI concierge
              - text: for mental health (
              - link "business.scoop.co.nz" [ref=e103] [cursor=pointer]:
                - /url: https://business.scoop.co.nz/2025/12/03/whakarongorau-celebrates-major-evolution-in-mental-health-support-with-ai-concierge-platform/#:~:text=Whakarongorau%20has%20received%20match%20funding,and%20addictions%20support%20in%20Aotearoa
              - text: ). This platform (developed with Valentia Tech and Spark Health) will use AI triage interviews (text/voice) to guide users to immediate help or relevant services, acting as a digital “front door” to care (
              - link "business.scoop.co.nz" [ref=e104] [cursor=pointer]:
                - /url: https://business.scoop.co.nz/2025/12/03/whakarongorau-celebrates-major-evolution-in-mental-health-support-with-ai-concierge-platform/#:~:text=The%20new%20platform%20will%20act,person%20services
              - text: ) (
              - link "business.scoop.co.nz" [ref=e105] [cursor=pointer]:
                - /url: https://business.scoop.co.nz/2025/12/03/whakarongorau-celebrates-major-evolution-in-mental-health-support-with-ai-concierge-platform/#:~:text=%E2%80%9CThis%20is%20such%20an%20important,%E2%80%9D
              - text: ). These projects aim to extend limited mental-health resources by giving users instant assistance and linking them to human care.
            - listitem [ref=e106]:
              - strong [ref=e107]: "Clinical diagnostics (collaboration):"
              - text: Health NZ’s AI Lab, in partnership with DHBs, is piloting AI in imaging. For example, Canterbury DHB is testing AI models that flag urgent abnormalities on X-rays/CT scans and auto-measure fractures (
              - link "www.hinz.org.nz" [ref=e108] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/702056/Health-NZ-explores-use-of-AI-in-radiology.htm#:~:text=Zealand%20www,Ora%20is%20exploring%20the%20use
              - text: ) (
              - link "www.pulseit.news" [ref=e109] [cursor=pointer]:
                - /url: https://www.pulseit.news/new-zealand-digital-health/new-zealand-digital-health-year-in-review-2025-a-new-direction/#:~:text=patient%20care%20across%20the%20country
              - text: "). Similarly, MBIE-backed startups (like Radiographic and other Kiwi firms) are trialling AI aids in pathology, cytology and vitals monitoring. International tools also appear in NZ practice: ambient scribes (e.g. iMedX’s “Heidi” used in Australia) were evaluated for NZ EDs. Trials found Heidi cut clinician documentation from ~17 minutes per patient to ~4 minutes (an 80%+ post-shift work reduction) ("
              - link "www.pulseit.news" [ref=e110] [cursor=pointer]:
                - /url: https://www.pulseit.news/new-zealand-digital-health/new-zealand-digital-health-year-in-review-2025-a-new-direction/#:~:text=Meanwhile%2C%20in%20the%20spirit%20of,patient%20care%20across%20the%20country
              - text: ). Following those trials, NZ went ahead with scribe rollouts. Broadly, such case studies show “narrow” AI (single-task tools) quietly augmenting clinicians without replacing them.
          - heading "Trends and Predictions" [level=2] [ref=e111]
          - list [ref=e112]:
            - listitem [ref=e113]:
              - strong [ref=e114]: "Rapid uptake in admin vs. cautious clinical use:"
              - text: Surveys indicate a race between enthusiasm and caution. A 2025 BNZ survey found ~2/3 of private health providers have used or are considering AI tools (
              - link "www.pulseit.news" [ref=e115] [cursor=pointer]:
                - /url: https://www.pulseit.news/new-zealand-digital-health/new-zealand-digital-health-year-in-review-2025-a-new-direction/#:~:text=Elsewhere%2C%20survey%20results%20showed%20continued,sector%2C%20particularly%20for%20administrative%20tasks
              - text: "). The most common are administrative: voice/text scribes, coding, scheduling assistants ("
              - link "www.pulseit.news" [ref=e116] [cursor=pointer]:
                - /url: https://www.pulseit.news/new-zealand-digital-health/new-zealand-digital-health-year-in-review-2025-a-new-direction/#:~:text=Elsewhere%2C%20survey%20results%20showed%20continued,sector%2C%20particularly%20for%20administrative%20tasks
              - text: "). In contrast, advanced clinical AI (imaging, diagnostics) largely remains in pilot or validation. Public hospitals are following suit: Te Whatu Ora and Health NZ focus current AI on workload bottlenecks (triage, docs, screening) with strict oversight. Generative AI (like ChatGPT) is notably"
              - emphasis [ref=e117]: restricted
              - text: – an official directive reminds staff not to input patient data into unvetted LLMs due to privacy and safety concerns. The prevailing message is that AI will
              - strong [ref=e118]: augment
              - text: front-line staff, not replace clinical judgment (
              - link "www.beehive.govt.nz" [ref=e119] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department#:~:text=Every%20emergency%20department%20in%20the,Health%20Minister%20Simeon%20Brown%20says
              - text: ) (
              - link "www.dha.org.nz" [ref=e120] [cursor=pointer]:
                - /url: https://www.dha.org.nz/member-news/medtech-global-launches-ai-powered-intelligence-layer-moving-beyond-traditional-scribing/#:~:text=Chrissie%20Patterson%2C%20Medtech%20general%20manager,judgment%20rather%20than%20replacing%20it
              - text: ).
            - listitem [ref=e121]:
              - strong [ref=e122]: "Efficiency and workflow gains:"
              - text: "Workforce shortages continue to drive interest in AI as a labour multiplier. AI scribes, like those in NZGPEvolution and EDs, are proving their worth: providers report dozens of minutes saved per consultation, allowing more patients seen and less burnout ("
              - link "www.beehive.govt.nz" [ref=e123] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department#:~:text=%E2%80%9CThis%20places%20New%20Zealand%20among,%E2%80%9D
              - text: ) (
              - link "www.dha.org.nz" [ref=e124] [cursor=pointer]:
                - /url: https://www.dha.org.nz/member-news/medtech-global-launches-ai-powered-intelligence-layer-moving-beyond-traditional-scribing/#:~:text=Patterson%20says%20reduced%20documentation%20time,helping%20to%20prevent%20clinician%20burnout
              - text: "). Similar gains are expected from automating back-office tasks (coding, roster management) and triage (e.g. AI-powered symptom screening apps). The South Auckland retinal screening example and the AI clinical notes tools illustrate a general trend: adopting AI first for high-volume, repetitive tasks (documentation, image grading) to relieve human bottlenecks ("
              - link "www.beehive.govt.nz" [ref=e125] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department#:~:text=%E2%80%9CThis%20places%20New%20Zealand%20among,%E2%80%9D
              - text: ) (
              - link "www.beehive.govt.nz" [ref=e126] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/new-ai-diabetes-screening-pilot-programme-gamechanger-wait-times#:~:text=%E2%80%9CThe%20use%20of%20AI%20in,ensuring%20patients%20have%20more%20timely
              - text: ). In the coming years, we’ll likely see AI extend more into virtual care (e.g. intelligent chat/telehealth assistants) and community-based screening.
            - listitem [ref=e127]:
              - strong [ref=e128]: "Regulation, ethics and trust:"
              - text: "NZ is building an “AI guardrail” approach. The Health and Disability system is developing ethics frameworks and liability rules: for now, health practitioners remain accountable for AI-driven decisions (covered by NZ’s no-fault ACC system for harm) ("
              - link "www.hinz.org.nz" [ref=e129] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/671309/#:~:text=entities%20must%20have%20policies%20regulating,regulating%20the%20use%20of%20AI
              - text: ). National guidelines (like PMCSA’s report) urge thorough testing of any AI tool for bias, accuracy and equity before use (
              - link "www.hinz.org.nz" [ref=e130] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/671309/#:~:text=entities%20must%20have%20policies%20regulating,regulating%20the%20use%20of%20AI
              - text: "). Māori and other under-served populations are a focus: frameworks explicitly require projects to uphold Te Tiriti o Waitangi and data sovereignty principles ("
              - link "www.ai-health-research.org.nz" [ref=e131] [cursor=pointer]:
                - /url: https://www.ai-health-research.org.nz/our-story#:~:text=
              - text: ) (
              - link "www.hinz.org.nz" [ref=e132] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/671309/#:~:text=entities%20must%20have%20policies%20regulating,regulating%20the%20use%20of%20AI
              - text: "). Training and certification programs for clinicians on AI use are emerging to ensure competence and public trust. In short, NZ is proceeding cautiously: every new AI application currently undergoes local validation and oversight committees before it reaches patients."
            - listitem [ref=e133]:
              - strong [ref=e134]: "Precision health future:"
              - text: Stakeholders see AI as a pillar of a more personalized system. NZ’s investment in national genomics (e.g. newborn sequencing) and digitized records is laying groundwork for AI-driven prevention. Experts envision tools that could predict individual disease risk or tailor drug choices. However, they caution this is medium-term and must avoid widening inequities (e.g. by focusing only on data-rich groups) (
              - link "www.hinz.org.nz" [ref=e135] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/705831/#:~:text=intelligence%20exploration%20and%20adoption,foreword%20that%20it%20complements%20work
              - text: ) (
              - link "www.hinz.org.nz" [ref=e136] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/671309/#:~:text=entities%20must%20have%20policies%20regulating,regulating%20the%20use%20of%20AI
              - text: "). Meanwhile, practical deployments (like AI triage in telehealth, or apps for remote monitoring) will grow in parallel, especially for rural and Māori communities if digital access is improved. Consensus forecasts steady growth: with public, private and iwi/Māori partners aligned on strategy, AI is expected to become a routine support in NZ healthcare – always with an emphasis on transparency and benefit to patients and clinicians alike ("
              - link "www.hinz.org.nz" [ref=e137] [cursor=pointer]:
                - /url: https://www.hinz.org.nz/news/705831/#:~:text=intelligence%20exploration%20and%20adoption,foreword%20that%20it%20complements%20work
              - text: ) (
              - link "www.ai-health-research.org.nz" [ref=e138] [cursor=pointer]:
                - /url: https://www.ai-health-research.org.nz/our-story#:~:text=
              - text: ).
          - heading "Conclusion" [level=2] [ref=e139]
          - paragraph [ref=e140]:
            - text: AI is gradually transitioning from pilot phase to operational use in New Zealand’s health sector. Recent initiatives – from nationwide AI scribes in EDs to AI-enabled screening pilots and GP workflow tools – demonstrate real gains in efficiency and access (
            - link "www.beehive.govt.nz" [ref=e141] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department#:~:text=%E2%80%9CThis%20places%20New%20Zealand%20among,%E2%80%9D
            - text: ) (
            - link "www.beehive.govt.nz" [ref=e142] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/new-ai-diabetes-screening-pilot-programme-gamechanger-wait-times#:~:text=%E2%80%9CThe%20use%20of%20AI%20in,ensuring%20patients%20have%20more%20timely
            - text: "). The common theme is complementing clinicians: AI frees up time for patient care and helps manage growing demand. All stakeholders stress that this must be done safely and equitably, under robust oversight frameworks ("
            - link "www.hinz.org.nz" [ref=e143] [cursor=pointer]:
              - /url: https://www.hinz.org.nz/news/671309/#:~:text=entities%20must%20have%20policies%20regulating,regulating%20the%20use%20of%20AI
            - text: ) (
            - link "www.dha.org.nz" [ref=e144] [cursor=pointer]:
              - /url: https://www.dha.org.nz/member-news/medtech-global-launches-ai-powered-intelligence-layer-moving-beyond-traditional-scribing/#:~:text=Chrissie%20Patterson%2C%20Medtech%20general%20manager,judgment%20rather%20than%20replacing%20it
            - text: ). Looking ahead, ongoing government investment (research grants, digital infrastructure), coordinated research networks, and evolving policies will continue to shape NZ’s unique AI-in-healthcare journey. This
            - emphasis [ref=e145]: Living Whitepaper
            - text: will be updated as developments unfold, aiming to guide NZ healthcare leaders on harnessing AI’s promise for better outcomes in Aotearoa.
          - paragraph [ref=e146]:
            - strong [ref=e147]: "Sources:"
            - text: Recent governmental releases, industry news and expert reports (Beehive.govt.nz, HRC, Health Informatics NZ, Pulse+IT, NZ Doctor, RNZ, etc.) (
