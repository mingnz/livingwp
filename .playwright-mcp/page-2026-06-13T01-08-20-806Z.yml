        - generic [ref=e27]:
          - 'heading "AI Adoption in Healthcare in New Zealand: A Living Whitepaper" [level=1] [ref=e28]'
          - paragraph [ref=e29]:
            - strong [ref=e30]: "Updated: 10 June 2026"
          - heading "Executive Summary" [level=2] [ref=e31]
          - paragraph [ref=e32]:
            - text: AI adoption in New Zealand healthcare is still best described as
            - strong [ref=e33]: targeted deployment under tightening control
            - text: . The clearest scaled public-sector use remains ambient documentation in emergency departments, where AI scribe technology is live nationwide for 1,250 frontline staff, with further licences being progressed largely for mental health teams. Health NZ’s updated privacy statement also confirms current use cases now span transcription, consultation summarisation, document generation, staff knowledge tools, and preliminary image review, while stressing that many uses remain in pilot phase and that AI is not used to make automated decisions about patient care. (
            - link "beehive.govt.nz" [ref=e34] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department
            - text: )
          - paragraph [ref=e35]:
            - text: The biggest shift since the previous update on
            - strong [ref=e36]: 2 April 2026
            - text: is that
            - strong [ref=e37]: imaging has moved one step closer to formal deployment
            - text: . On
            - strong [ref=e38]: 27 May 2026
            - text: ", the Government said procurement was underway to select a preferred AI mammogram-reading tool for testing and validation in BreastScreen Aotearoa, ahead of a planned rollout from"
            - strong [ref=e39]: early 2027
            - text: . That makes breast screening the most visible next-wave national clinical AI programme. (
            - link "beehive.govt.nz" [ref=e40] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-breast-screening-tool-one-step-closer
            - text: )
          - paragraph [ref=e41]:
            - text: At the same time, governance has become more operational. Since April, Health NZ has updated its enterprise privacy statement, published staff guidance on generative AI and LLMs, and reinforced that employees must not put patient or sensitive organisational information into unapproved tools or use LLMs for clinical decisions. Separately, a University of Auckland-led evaluation framework endorsed by Health NZ’s Executive Leadership Team is now being used to assess all proposed AI tools across Health NZ services. (
            - link "info.health.nz" [ref=e42] [cursor=pointer]:
              - /url: https://info.health.nz/privacy/privacy-statement
            - text: )
          - paragraph [ref=e43]:
            - text: "The overall picture is therefore clearer than it was in early April:"
            - strong [ref=e44]: New Zealand is still early-stage at a system level, but no longer merely exploratory
            - text: . The live model is clinician-supervised augmentation; the fastest diffusion is in documentation-heavy workflows; the strongest clinical scale-up lane is imaging and screening; and privacy, equity, Māori data sovereignty, and cybersecurity are increasingly being treated as prerequisites for scale rather than side issues. (
            - link "health.govt.nz" [ref=e45] [cursor=pointer]:
              - /url: https://www.health.govt.nz/strategies-initiatives/programmes-and-initiatives/precision-health-ai-and-genomics
            - text: )
          - heading "What Has Changed Since 2 April 2026" [level=2] [ref=e46]
          - list [ref=e47]:
            - listitem [ref=e48]:
              - strong [ref=e49]: Breast screening has advanced from exploration to procurement.
              - text: Health NZ is now selecting a preferred AI mammogram-reading tool for testing and validation, with a planned rollout from early 2027. The proposed model would have AI perform one of the two independent reads, while clinicians remain central to diagnosis and follow-up decisions. (
              - link "beehive.govt.nz" [ref=e50] [cursor=pointer]:
                - /url: https://www.beehive.govt.nz/release/ai-breast-screening-tool-one-step-closer
              - text: )
            - listitem [ref=e51]:
              - strong [ref=e52]: Health NZ’s AI privacy position is more explicit and more current.
              - text: Its privacy statement was updated on
              - strong [ref=e53]: 30 April 2026
              - text: and now lists current AI uses including transcription, consultation summaries, document generation, staff knowledge tools, Microsoft Copilot-style support, and preliminary review of images, x-rays, scans, or mammograms. It also says many of these uses are still being tested on a limited basis. (
              - link "info.health.nz" [ref=e54] [cursor=pointer]:
                - /url: https://info.health.nz/privacy/privacy-statement
              - text: )
            - listitem [ref=e55]:
              - strong [ref=e56]: Health NZ has published staff-facing generative AI rules.
              - text: Updated in
              - strong [ref=e57]: May 2026
              - text: ", the guidance says staff must not enter patient or other sensitive information into unapproved LLMs and must not use such tools for clinical decisions or personalised advice to patients. It also says Health NZ does not currently have any private LLMs available. ("
              - link "healthnz.govt.nz" [ref=e58] [cursor=pointer]:
                - /url: https://www.healthnz.govt.nz/health-professionals/guidance-standards/topic/digital-technologies/using-generative-ai-and-large-language-models
              - text: )
            - listitem [ref=e59]:
              - strong [ref=e60]: AI assessment inside Health NZ appears to be more standardised.
              - text: A nationally tailored AI evaluation framework, endorsed in
              - strong [ref=e61]: March 2026
              - text: ", is now being used to assess all proposed AI tools across Health NZ services. ("
              - link "transform.auckland.ac.nz" [ref=e62] [cursor=pointer]:
                - /url: https://www.transform.auckland.ac.nz/2026/04/30/collaboratively-developing-an-evaluation-framework-for-ai-tools-in-the-aotearoa-new-zealand-health-sector/?utm_source=openai
              - text: )
            - listitem [ref=e63]:
              - strong [ref=e64]: Aged care has become a more visible adoption setting.
              - text: "On"
              - strong [ref=e65]: 12 May 2026
              - text: ", Metlifecare said it was rolling out the HEIDI ambient scribe tool to three more care homes after a four-month trial at Parkside Village. ("
              - link "metlifecare.co.nz" [ref=e66] [cursor=pointer]:
                - /url: https://www.metlifecare.co.nz/news/metlifecare-heidi-scribe-tool
              - text: )
            - listitem [ref=e67]:
              - strong [ref=e68]: The privacy environment tightened further from 1 May 2026.
              - text: The Office of the Privacy Commissioner says the Health Information Privacy Code was amended in March 2026 to reflect IPP3A, with the updated code in force from
              - strong [ref=e69]: 1 May 2026
              - text: . (
              - link "privacy.org.nz" [ref=e70] [cursor=pointer]:
                - /url: https://www.privacy.org.nz/privacy-principles/codes-of-practice/hipc2020/?utm_source=openai
              - text: )
          - heading "Current State of AI Adoption" [level=2] [ref=e71]
          - 'heading "1. Public hospitals: documentation remains the most mature live deployment" [level=2] [ref=e72]'
          - paragraph [ref=e73]:
            - text: The most mature public-sector AI deployment in New Zealand healthcare remains the nationwide emergency department scribe rollout announced on
            - strong [ref=e74]: 28 February 2026
            - text: . The Government said the technology was live in all emergency departments, reaching
            - strong [ref=e75]: 1,250 ED doctors and frontline staff
            - text: ", and that more than"
            - strong [ref=e76]: 1,000 additional licences
            - text: were being progressed, predominantly for mental health teams. (
            - link "beehive.govt.nz" [ref=e77] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department
            - text: )
          - paragraph [ref=e78]:
            - text: "That rollout still matters strategically because it shows where Health NZ is currently most willing to scale AI:"
            - strong [ref=e79]: workflow-embedded, clinician-reviewed documentation support
            - text: ", rather than autonomous diagnosis or treatment. Health NZ’s privacy statement reinforces the same operating model by saying AI outputs affecting records or decisions must be reviewed by the responsible clinician and that AI is not used to make automated decisions about care. ("
            - link "beehive.govt.nz" [ref=e80] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department
            - text: )
          - paragraph [ref=e81]:
            - text: There is also now more public documentation around that deployment. On
            - strong [ref=e82]: 28 April 2026
            - text: ", Health NZ published an OIA release on Heidi AI that it said provides an overview of governance, risk management, privacy safeguards, and early evaluation findings related to Heidi’s use in clinical settings. That publication is notable less for signalling a new rollout than for showing a stronger transparency-and-assurance layer around an already live deployment. ("
            - link "healthnz.govt.nz" [ref=e83] [cursor=pointer]:
              - /url: https://www.healthnz.govt.nz/publications/information-relating-to-the-use-and-evaluation-of-heidi-ai-oia
            - text: )
          - 'heading "2. Primary care: rapid uptake is becoming more integrated and more governed" [level=2] [ref=e84]'
          - paragraph [ref=e85]:
            - text: Primary care remains the fastest-moving non-hospital environment. A New Zealand survey paper published on
            - strong [ref=e86]: 26 March 2026
            - text: described AI scribes as having had “rapid uptake” in primary care. In the search summary, the study reported that 40% of respondents had experience with AI scribes, while only 59% had sought patient consent and 66% had read the tool’s terms and conditions. (
            - link "pubmed.ncbi.nlm.nih.gov" [ref=e87] [cursor=pointer]:
              - /url: https://pubmed.ncbi.nlm.nih.gov/41134014/
            - text: )
          - paragraph [ref=e88]:
            - text: Commercial offerings are also maturing. Medtech says its
            - strong [ref=e89]: Medtech AI
            - text: platform, available in New Zealand from
            - strong [ref=e90]: 23 February 2026
            - text: ", is integrated directly with Medtech Evolution, stores all data locally in New Zealand, does not retain consultation audio, does not store patient names, dates of birth, or NHI numbers, and requires a clinician confirmation that explicit patient consent has been obtained before recording begins. The platform also positions itself as broader than a scribe, with structured notes, referral letters, patient summaries, and clinician-reviewed outputs written back into the PMS. ("
            - link "medtechglobal.com" [ref=e91] [cursor=pointer]:
              - /url: https://medtechglobal.com/nz/medtech-ai-launch/?utm_source=openai
            - text: )
          - paragraph [ref=e92]:
            - text: A useful signal of diffusion is the follow-on education layer. Medtech ran a nationwide
            - strong [ref=e93]: 12+ location
            - text: “education lab” roadshow across April and May 2026, explicitly aimed at clinicians and practice teams. That suggests the market is moving from simple experimentation toward repeatable onboarding, workflow redesign, and mainstream practice enablement. (
            - link "medtechglobal.com" [ref=e94] [cursor=pointer]:
              - /url: https://medtechglobal.com/nz/medtech-ai-education-labs-2/
            - text: )
          - 'heading "3. Aged care: ambient scribing is spreading beyond hospitals and GP clinics" [level=2] [ref=e95]'
          - paragraph [ref=e96]:
            - text: One of the clearest newer case studies is in residential aged care. Metlifecare said on
            - strong [ref=e97]: 12 May 2026
            - text: that it would roll out the HEIDI ambient scribe tool across three more care homes after a four-month trial at Parkside Village involving
            - strong [ref=e98]: 12 registered nurses
            - text: . It said nurses reported less time spent on documentation, better continuity of care and handovers, and growing uptake to full adoption within the Parkside nursing team over a few weeks. Metlifecare also stressed that nurses retain responsibility for reviewing, editing, and approving all documentation, and that the tool is used with resident consent. (
            - link "metlifecare.co.nz" [ref=e99] [cursor=pointer]:
              - /url: https://www.metlifecare.co.nz/news/metlifecare-heidi-scribe-tool
            - text: )
          - paragraph [ref=e100]:
            - text: This matters because it broadens the New Zealand adoption story. AI documentation is no longer just a hospital ED or GP-clinic phenomenon; it is now visibly moving into
            - strong [ref=e101]: aged residential care
            - text: ", where staffing pressure, handover quality, and time spent documenting are also major operational issues. ("
            - link "metlifecare.co.nz" [ref=e102] [cursor=pointer]:
              - /url: https://www.metlifecare.co.nz/news/metlifecare-heidi-scribe-tool
            - text: )
          - 'heading "4. Screening and imaging: now the strongest next-wave clinical scale-up lane" [level=2] [ref=e103]'
          - paragraph [ref=e104]:
            - text: Breast screening is now the most important post-April development. On
            - strong [ref=e105]: 27 May 2026
            - text: ", the Government said procurement was underway for a preferred AI mammogram-reading tool, with testing and validation planned ahead of a rollout from"
            - strong [ref=e106]: early 2027
            - text: ". The proposed design is cautious: AI would perform one of the two independent reads already required in the screening process, with qualified professionals remaining central to all diagnosis and follow-up decisions. ("
            - link "beehive.govt.nz" [ref=e107] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-breast-screening-tool-one-step-closer
            - text: )
          - paragraph [ref=e108]:
            - text: This is more significant than it may first appear. BreastScreen Aotearoa already screens about
            - strong [ref=e109]: 270,000 women annually
            - text: ", and the programme’s age extension to"
            - strong [ref=e110]: "74"
            - text: is underway, so the combination of rising volume and workforce pressure creates a strong operational case for AI-assisted reading. The Government is explicitly framing AI here as a capacity and early-detection tool, not a clinician substitute. (
            - link "beehive.govt.nz" [ref=e111] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-breast-screening-tool-one-step-closer
            - text: )
          - paragraph [ref=e112]:
            - text: The broader imaging lane remains credible beyond breast screening. Health NZ’s privacy statement confirms that AI is already being used to read, analyse, or review clinical information for preliminary results, including images, x-rays, scans, or mammograms, while noting that many such uses are still in pilot phase. Meanwhile, the Ministry of Health’s updated precision health page still cites the AI-equipped South Auckland diabetes retinal screening pilot as an example of current national activity while stating that New Zealand remains in the early stages of safe adoption. (
            - link "info.health.nz" [ref=e113] [cursor=pointer]:
              - /url: https://info.health.nz/privacy/privacy-statement
            - text: )
          - heading "Governance, Regulation, and Digital Foundations" [level=2] [ref=e114]
          - heading "1. The official stance is still “assist clinicians, do not automate care”" [level=2] [ref=e115]
          - paragraph [ref=e116]:
            - text: Health NZ’s updated privacy statement is unusually clear. It says AI is used in a
            - strong [ref=e117]: closed environment
            - text: ", that personal information is not used to design commercial AI or third-party generative models, that short-term disclosures to providers are deleted shortly afterwards, and that anything generated by AI that could affect the record or clinical decisions must be reviewed by the responsible clinician. It also states plainly that Health NZ does"
            - strong [ref=e118]: not
            - text: use AI to make automated decisions about a person’s healthcare. (
            - link "info.health.nz" [ref=e119] [cursor=pointer]:
              - /url: https://info.health.nz/privacy/privacy-statement
            - text: )
          - paragraph [ref=e120]:
            - text: "Health NZ’s separate May 2026 guidance on generative AI and LLMs adds the staff-operating rules: unapproved LLMs cannot be used for patient data entry, clinical decisions, or personalised patient advice, and the organisation says it does not currently have private LLMs available. That is a strong signal that broad public-LLM adoption inside Health NZ remains tightly constrained. ("
            - link "healthnz.govt.nz" [ref=e121] [cursor=pointer]:
              - /url: https://www.healthnz.govt.nz/health-professionals/guidance-standards/topic/digital-technologies/using-generative-ai-and-large-language-models
            - text: )
          - paragraph [ref=e122]:
            - text: The Medical Council’s guidance, published on
            - strong [ref=e123]: 10 March 2026
            - text: ", remains the profession-level counterpart to this system stance. It says doctors remain responsible for all clinical decisions, must check AI output, must tell patients when AI is being used in their care, must obtain informed consent in specified circumstances including AI consultation recording, and must not use AI to impersonate themselves through avatars or chatbots. ("
            - link "mcnz.org.nz" [ref=e124] [cursor=pointer]:
              - /url: https://www.mcnz.org.nz/assets/standards/Guidance-on-using-artificial-intelligence-AI-in-patient-care-March-2026.pdf
            - text: )
          - heading "2. Governance is becoming more formal and more standardised" [level=2] [ref=e125]
          - paragraph [ref=e126]:
            - text: Health NZ’s National Artificial Intelligence and Algorithm Expert Advisory Group remains the core governance mechanism. Health NZ says all AI development or implementation plans must be registered with the group, which oversees ethical, technical, clinical, and operational standards and is intended to maintain an AI register and publish summaries of recommendations and a national register of AI in use. (
            - link "info.health.nz" [ref=e127] [cursor=pointer]:
              - /url: https://info.health.nz/about-us/who-we-are/expert-and-advisory-groups/advisory-groups/artificial-intelligence-and-algorithm-expert-advisory-group
            - text: )
          - paragraph [ref=e128]:
            - text: The newly publicised evaluation framework strengthens that picture. According to the University of Auckland’s TRANSFORM programme, a New Zealand-specific framework was endorsed by Health NZ’s Executive Leadership Team in March 2026 and is now being used to assess all proposed AI tools across Health NZ services. Because it was designed after reviewing 31 international frameworks and adapted to the local health system, it suggests Health NZ is moving from ad hoc review toward a more repeatable national method for AI assessment. (
            - link "transform.auckland.ac.nz" [ref=e129] [cursor=pointer]:
              - /url: https://www.transform.auckland.ac.nz/2026/04/30/collaboratively-developing-an-evaluation-framework-for-ai-tools-in-the-aotearoa-new-zealand-health-sector/?utm_source=openai
            - text: )
          - heading "3. Privacy and cybersecurity are now part of the adoption story, not background issues" [level=2] [ref=e130]
          - paragraph [ref=e131]:
            - text: The regulatory baseline also hardened on
            - strong [ref=e132]: 1 May 2026
            - text: ", when the updated Health Information Privacy Code reflecting IPP3A came into force. For healthcare AI, that matters because New Zealand’s compliance environment is becoming more demanding around how indirectly collected personal and health information is handled. ("
            - link "privacy.org.nz" [ref=e133] [cursor=pointer]:
              - /url: https://www.privacy.org.nz/privacy-principles/codes-of-practice/hipc2020/?utm_source=openai
            - text: )
          - paragraph [ref=e134]:
            - text: Budget 2026 adds another important layer. On
            - strong [ref=e135]: 28 May 2026
            - text: ", the Government announced"
            - strong [ref=e136]: $153.6 million
            - text: for Health NZ cybersecurity improvements, including national monitoring, stronger data security processes, critical IT safety upgrades, and AI-enabled assessments to improve cyber maturity across primary care. This is not clinical AI adoption, but it is part of the infrastructure needed for AI adoption at scale. (
            - link "beehive.govt.nz" [ref=e137] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/investing-cyber-security-protect-patient-data
            - text: )
          - heading "Research and Innovation Pipeline" [level=2] [ref=e138]
          - paragraph [ref=e139]:
            - text: New Zealand’s research pipeline remains stronger than its current live deployment footprint. The Health Research Council said in August 2025 that it had funded
            - strong [ref=e140]: 10 AI in Healthcare studies worth $4.6 million
            - text: ", and those projects continue to shape the near-term implementation pipeline. ("
            - link "hrc.govt.nz" [ref=e141] [cursor=pointer]:
              - /url: https://www.hrc.govt.nz/news-and-events/nz-researchers-awarded-714m-tackle-pressing-health-issues?utm_source=openai
            - text: )
          - paragraph [ref=e142]: "The portfolio remains notably practical:"
          - list [ref=e143]:
            - listitem [ref=e144]:
              - strong [ref=e145]: "Acute stroke:"
              - text: a Health NZ-led project is measuring whether AI-assisted rapid brain-scan interpretation improves intervention rates and reduces treatment delays across NZ hospitals. (
              - link "hrc.govt.nz" [ref=e146] [cursor=pointer]:
                - /url: https://www.hrc.govt.nz/resources/research-repository/optimising-acute-stroke-care-artificial-intelligence?utm_source=openai
              - text: )
            - listitem [ref=e147]:
              - strong [ref=e148]: "Digital pathology for gastrointestinal cancers:"
              - text: Otago researchers are building AI tools that combine biopsy images and patient data to improve treatment decisions and reduce unnecessary surgery. (
              - link "hrc.govt.nz" [ref=e149] [cursor=pointer]:
                - /url: https://www.hrc.govt.nz/resources/research-repository/improving-gastrointestinal-cancer-outcomes-ai-enhanced-digital?utm_source=openai
              - text: )
            - listitem [ref=e150]:
              - strong [ref=e151]: "Postoperative monitoring:"
              - text: Auckland researchers are using digital tools and AI to detect deterioration earlier after surgery, with explicit attention to privacy, equity, and data sovereignty. (
              - link "hrc.govt.nz" [ref=e152] [cursor=pointer]:
                - /url: https://www.hrc.govt.nz/resources/research-repository/toward-digital-paradigm-postoperative-monitoring?utm_source=openai
              - text: )
            - listitem [ref=e153]:
              - strong [ref=e154]: "Healthy ageing:"
              - text: the NZ–Singapore programme includes AI-assisted interRAI assessment and predictive tools for ageing-related risks, designed with explicit attention to Māori, Pacific, and other diverse communities. (
              - link "otago.ac.nz" [ref=e155] [cursor=pointer]:
                - /url: https://www.otago.ac.nz/christchurch/big-data-better-ageing/research/ai-assisted-interrai-assessment-and-evaluation-for-person-centred-care-planning-and-healthy-ageing?utm_source=openai
              - text: )
          - paragraph [ref=e156]:
            - text: Taken together, this pipeline suggests that New Zealand’s next material advances are likely to come less from broad autonomous AI and more from
            - strong [ref=e157]: high-need, measurable, clinician-supervised use cases
            - text: in imaging, risk prediction, monitoring, and workflow support. That is an inference from the current deployment pattern and funded portfolio. (
            - link "hrc.govt.nz" [ref=e158] [cursor=pointer]:
              - /url: https://www.hrc.govt.nz/resources/research-repository/optimising-acute-stroke-care-artificial-intelligence?utm_source=openai
            - text: )
          - heading "Trust, Equity, and Social Licence" [level=2] [ref=e159]
          - paragraph [ref=e160]:
            - text: Recent New Zealand research continues to show that adoption will be constrained as much by trust as by technical capability. A February 2026 NZMJ viewpoint argued that patient trust is central to the successful implementation of healthcare AI in Aotearoa New Zealand and highlighted the importance of public benefit, clear governance, data protection, choice, clinician responsibility, and Māori representation. (
            - link "nzmj.org.nz" [ref=e161] [cursor=pointer]:
              - /url: https://nzmj.org.nz/journal/vol-139-no-1629/maintaining-patient-trust-as-artificial-intelligence-s-role-in-healthcare-grows?utm_source=openai
            - text: )
          - paragraph [ref=e162]:
            - text: That concern is echoed in more specific community research. A 2026 study on Pasifika perspectives on AI for asthma management found interest in AI’s potential, but also persistent concerns around privacy, accuracy, access, and age-related digital divides. (
            - link "openrepository.aut.ac.nz" [ref=e163] [cursor=pointer]:
              - /url: https://openrepository.aut.ac.nz/items/06287e76-ec90-4a5c-9a99-1c86e57f4124?utm_source=openai
            - text: )
          - paragraph [ref=e164]:
            - text: These findings line up closely with Health NZ’s own caution on public LLMs, its emphasis on clinician review, and its explicit references to Māori data sovereignty and bias risk in both governance and staff guidance. (
            - link "healthnz.govt.nz" [ref=e165] [cursor=pointer]:
              - /url: https://www.healthnz.govt.nz/health-professionals/guidance-standards/topic/digital-technologies/using-generative-ai-and-large-language-models
            - text: )
          - heading "Key Trends" [level=2] [ref=e166]
          - heading "1. Documentation-first adoption is no longer a pilot story" [level=3] [ref=e167]
          - paragraph [ref=e168]:
            - text: Ambient scribing has moved from isolated experimentation to a cross-setting pattern spanning emergency departments, general practice, and now visible aged-care deployments. (
            - link "beehive.govt.nz" [ref=e169] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department
            - text: )
          - heading "2. Imaging is now the clearest clinical expansion lane" [level=3] [ref=e170]
          - paragraph [ref=e171]:
            - text: Breast screening procurement, continuing retinal-screening activity, and HRC-funded stroke and pathology projects all point to imaging and interpretation tasks as the most likely next area for scaled clinical AI in New Zealand. (
            - link "beehive.govt.nz" [ref=e172] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-breast-screening-tool-one-step-closer
            - text: )
          - heading "3. Governance is shifting from principle to operating rules" [level=3] [ref=e173]
          - paragraph [ref=e174]:
            - text: The Medical Council guidance, Health NZ privacy statement, Health NZ LLM rules, NAIAEAG process, and the new evaluation framework together amount to a much more operational governance stack than New Zealand had even a few months ago. (
            - link "mcnz.org.nz" [ref=e175] [cursor=pointer]:
              - /url: https://www.mcnz.org.nz/assets/standards/Guidance-on-using-artificial-intelligence-AI-in-patient-care-March-2026.pdf
            - text: )
          - heading "4. Private and community providers are moving faster than high-risk hospital AI" [level=3] [ref=e176]
          - paragraph [ref=e177]:
            - text: Primary care vendors and aged-care operators are visibly shipping and rolling out tools faster than the public system is scaling higher-risk diagnostic AI. (
            - link "medtechglobal.com" [ref=e178] [cursor=pointer]:
              - /url: https://medtechglobal.com/nz/medtech-ai-launch/?utm_source=openai
            - text: )
          - heading "5. Cybersecurity and privacy are becoming adoption bottlenecks and enablers" [level=3] [ref=e179]
          - paragraph [ref=e180]:
            - text: The combination of stricter privacy expectations, staff restrictions on public LLMs, and new cyber investment shows that safe AI scale in healthcare is now inseparable from data governance and security maturity. (
            - link "privacy.org.nz" [ref=e181] [cursor=pointer]:
              - /url: https://www.privacy.org.nz/privacy-principles/codes-of-practice/hipc2020/?utm_source=openai
            - text: )
          - heading "Overall Assessment" [level=2] [ref=e182]
          - paragraph [ref=e183]:
            - text: As of
            - strong [ref=e184]: 10 June 2026
            - text: ", AI in New Zealand healthcare has progressed from cautious experimentation to"
            - strong [ref=e185]: selective operationalisation with harder governance
            - text: . The most mature deployments are still in documentation and workflow support; the most important new public development since April is the move of AI mammogram reading into procurement and validation for BreastScreen Aotearoa; and the strongest private-sector momentum is in integrated primary-care and aged-care documentation tools. (
            - link "beehive.govt.nz" [ref=e186] [cursor=pointer]:
              - /url: https://www.beehive.govt.nz/release/ai-scribe-now-every-emergency-department
            - text: )
          - paragraph [ref=e187]:
            - text: "But the sector remains early-stage overall. The Ministry of Health still says New Zealand is in the early stages of assessing how AI can be safely adopted, and Health NZ itself says many current uses are still being tested on a limited basis. The evidence therefore supports a clear conclusion:"
            - strong [ref=e188]: New Zealand’s healthcare AI model is maturing, but it is maturing as supervised augmentation rather than automation
            - text: . The country is building the rules, procurement pathways, and trust architecture needed for broader adoption, while keeping clinicians visibly accountable for care. (
            - link "health.govt.nz" [ref=e189] [cursor=pointer]:
              - /url: https://www.health.govt.nz/strategies-initiatives/programmes-and-initiatives/precision-health-ai-and-genomics
            - text: )
