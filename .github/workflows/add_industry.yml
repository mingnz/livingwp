name: Add Industry

on:
  workflow_dispatch:
    inputs:
      industry_name:
        description: "The name of the new industry"
        required: true
        type: string

jobs:
  add-industry:
    runs-on: ubuntu-latest
    outputs:
      industry_key: ${{ steps.add_industry_to_config.outputs.industry_key }}
      branch_name: ${{ steps.add_industry_to_config.outputs.branch_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/agent/package-lock.json

      - name: Install dependencies
        working-directory: src/agent
        run: npm ci

      - name: Add industry to config
        id: add_industry_to_config
        working-directory: src/agent
        env:
          INDUSTRY_NAME: ${{ inputs.industry_name }}
        run: |
          INDUSTRY_KEY=$(npm run --silent add-industry -- "$INDUSTRY_NAME")
          echo "industry_key=$INDUSTRY_KEY" >> $GITHUB_OUTPUT
          echo "branch_name=chore/add-industry-$INDUSTRY_KEY" >> $GITHUB_OUTPUT
          echo "Added industry '$INDUSTRY_KEY' to industries.json"

      - name: Create Pull Request        
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add ${{ steps.add_industry_to_config.outputs.industry_key }} industry (${{ github.run_id }})"
          title: "feat: ✨ add ${{ steps.add_industry_to_config.outputs.industry_key }} industry"
          body: |
            This PR was automatically generated by the add industry action.

            ## Changes
            - Added new entry to industry list
            - Created initial article
            - Generated on: ${{ github.run_id }}

            Please review the changes before merging.
          branch: ${{ steps.add_industry_to_config.outputs.branch_name }}
          delete-branch: true
          draft: false

  run-agent:    
    uses: ./.github/workflows/run_agent.yml
    needs: add-industry
    with:
      article_filter: ${{ needs.add-industry.outputs.industry_key }}
      branch_name: ${{ needs.add-industry.outputs.branch_name }}
    secrets: inherit
